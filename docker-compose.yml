services:
  # 后端服务，我们将其命名为 'backend'
  backend:
    build:
      # build 的上下文目录是 ./ai_fairness_be
      context: ./ai_fairness_be
    container_name: fairness_backend
    restart: unless-stopped

    # --- 新增内容 ---
    ports:
      - "5000:5000"  # 将主机的 5000 端口映射到容器的 5000 端口 (Flask 默认端口)
    environment:
      # 这个路径必须是 Stata 在【Docker 容器内部】的安装路径
      # 您需要根据您的后端 Dockerfile 来设置正确的值
      - STATA_PATH=/usr/local/stata17
    # --- 新增结束 ---

    # volumes:
      # 开发时可以取消注释下面这行，实现代码热更新
      # - ./ai_fairness_be:/app
    networks:
      - fairness_net

  # 前端服务
  frontend:
    build:
      context: ./ai_fairness_frontend
      dockerfile: Dockerfile.dev   # <-- 1. 指向新的 Dockerfile.dev
    container_name: fairness_frontend
    restart: unless-stopped
    ports:
      - "8080:5173"              # <-- 2. 将主机的 8080 端口映射到容器 Vite 的 5173 端口
    volumes:
      # 挂载您的代码，实现热更新
      - ./ai_fairness_frontend:/app
      # 使用一个匿名卷来“保护”容器内的 node_modules，防止被覆盖
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - fairness_net

# 定义网络
networks:
  fairness_net:
    driver: bridge
